name: flut
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  shared_preferences: ^2.2.2
  audioplayers: ^6.0.0
  path_provider: ^2.1.5
  share_plus: ^10.1.2
  file_picker: ^8.1.4
  flutter_local_notifications: ^18.0.1
  timezone: ^0.9.4
  flutter_timezone: ^1.0.8
  firebase_core: ^4.15.0
  firebase_auth: ^6.7.0
  sign_in_with_apple: ^8.1.0
  crypto: ^3.0.7
  cloud_firestore: ^6.10.0
  fl_chart: ^1.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  path_provider_platform_interface: ^2.1.2

flutter:
  uses-material-design: true

  assets:
    - assets/background.jpg
    - assets/data/challenge.json
    - assets/sounds/
    - assets/products/
